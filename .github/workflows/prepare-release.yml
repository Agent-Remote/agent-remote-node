name: prepare-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - name: Normalize version
        id: version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: ${{ inputs.version }}" >&2
            exit 2
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "Tag v${version} already exists" >&2
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - name: Resolve pinned device proxy dependency
        id: device
        run: |
          set -euo pipefail
          test "$(jq -er .schema_version release-dependencies.json)" = "2"
          test "$(jq -er .device_proxy.repository release-dependencies.json)" = \
            "Agent-Remote/agent-remote-device"
          version=$(jq -er .device_proxy.version release-dependencies.json)
          commit=$(jq -er .device_proxy.commit release-dependencies.json)
          workflow=$(jq -er .device_proxy.release_workflow release-dependencies.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$workflow" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.ya?ml$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-device
          ref: v${{ steps.device.outputs.version }}
          path: .external/agent-remote-device
          persist-credentials: false
      - name: Verify managed skill matches tagged device source
        env:
          DEVICE_COMMIT: ${{ steps.device.outputs.commit }}
        run: |
          test "$(git -C .external/agent-remote-device rev-parse HEAD)" = "$DEVICE_COMMIT"
          scripts/check-managed-skills.sh .external/agent-remote-device
      - name: Prepare version files
        run: scripts/prepare-release.sh "${{ steps.version.outputs.value }}"
      - name: Commit and tag
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add README.md README.zh-CN.md config.example.json internal/config/config.go scripts/build-release.sh CHANGELOG.md
            git commit -m "chore: release v${version}"
          fi
          git tag "v${version}"
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "v${version}"
          gh workflow run release.yml --ref "v${version}" -f version="${version}"
        env:
          GH_TOKEN: ${{ github.token }}
