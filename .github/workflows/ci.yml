name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - run: scripts/run-quality-checks.sh
      - name: Generate coverage with session network namespace integration
        run: |
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "GOCACHE=$RUNNER_TEMP/root-go-cache" \
            AGENT_REMOTE_RUN_NETNS_TEST=1 \
            go test -covermode=atomic -coverprofile=coverage.out ./...
          sudo chown "$USER:$(id -gn)" coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.out
          use_oidc: true
