name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Resolve pinned device proxy dependency
        id: device
        run: |
          set -euo pipefail
          test "$(jq -er .schema_version release-dependencies.json)" = "2"
          test "$(jq -er .device_proxy.repository release-dependencies.json)" = \
            "Agent-Remote/agent-remote-device"
          version=$(jq -er .device_proxy.version release-dependencies.json)
          commit=$(jq -er .device_proxy.commit release-dependencies.json)
          workflow=$(jq -er .device_proxy.release_workflow release-dependencies.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$workflow" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.ya?ml$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.0
        with:
          repository: Agent-Remote/agent-remote-device
          ref: v${{ steps.device.outputs.version }}
          path: .external/agent-remote-device
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - name: Verify managed skill matches device source
        env:
          DEVICE_COMMIT: ${{ steps.device.outputs.commit }}
        run: |
          test "$(git -C .external/agent-remote-device rev-parse HEAD)" = "$DEVICE_COMMIT"
          scripts/check-managed-skills.sh .external/agent-remote-device
      - name: Scan reachable Go vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -json ./... > govulncheck.json
          jq -s -e 'any(.[]; has("finding")) | not' govulncheck.json >/dev/null
      - name: Upload Go vulnerability report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-remote-node-govulncheck
          path: govulncheck.json
          if-no-files-found: error
      - run: scripts/run-quality-checks.sh
      - name: Generate coverage with session network namespace integration
        run: |
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "GOCACHE=$RUNNER_TEMP/root-go-cache" \
            AGENT_REMOTE_RUN_NETNS_TEST=1 \
            go test -covermode=atomic -coverprofile=coverage.out ./...
          sudo chown "$USER:$(id -gn)" coverage.out
          scripts/check-coverage.sh coverage.out 45
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.out
          use_oidc: true
