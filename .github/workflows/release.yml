name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version: $version" >&2
            exit 2
          fi
          test "$GITHUB_REF" = "refs/tags/v${version}"
          source_version=$(sed -n 's/^var DefaultVersion = "\([^"]*\)"/\1/p' internal/config/config.go)
          test "$source_version" = "$version"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - name: Scan reachable Go vulnerabilities
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          report="agent-remote-node-${VERSION}.govulncheck.json"
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -json ./... > "$report"
          sha256sum "$report" > "$report.sha256"
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Download and verify matching device proxy releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/device-download"
          proxy_root="$RUNNER_TEMP/device-proxies"
          mkdir -p "$download" "$proxy_root"
          gh release download "v${VERSION}" \
            --repo Agent-Remote/agent-remote-device \
            --dir "$download" \
            --pattern "agent-remote-device-proxy-*-${VERSION}.tar.gz" \
            --pattern "agent-remote-device-proxy-*-${VERSION}.tar.gz.sha256" \
            --pattern "agent-remote-device-proxy-*-${VERSION}.tar.gz.sigstore.json"
          for label in linux-amd64-glibc linux-arm64-glibc linux-amd64-musl linux-arm64-musl; do
            archive="agent-remote-device-proxy-${label}-${VERSION}.tar.gz"
            test -f "$download/$archive"
            (cd "$download" && sha256sum --check "$archive.sha256")
            cosign verify-blob \
              --bundle "$download/$archive.sigstore.json" \
              --certificate-identity \
                "https://github.com/Agent-Remote/agent-remote-device/.github/workflows/prepare-release.yml@refs/tags/v${VERSION}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$download/$archive"
            mkdir -p "$proxy_root/$label"
            tar -xzf "$download/$archive" -C "$proxy_root/$label"
          done
          echo "DEVICE_PROXY_DIR=$proxy_root" >> "$GITHUB_ENV"
      - name: Run tests
        run: |
          go test ./...
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "GOCACHE=$RUNNER_TEMP/root-go-cache" \
            AGENT_REMOTE_RUN_NETNS_TEST=1 \
            go test -run '^TestDialNetworkNamespaceLoopbackIntegration$' ./internal/runtimehelper
          tests/install_scripts_test.sh
      - name: Build release packages
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: scripts/build-release.sh
      - name: Generate release checksums
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            sha256sum "$archive" > "$archive.sha256"
          done
      - name: Generate Node release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/agent-remote-node-${{ steps.version.outputs.value }}.spdx.json
      - name: Sign Node release archives
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          for archive in dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done
          report="agent-remote-node-${VERSION}.govulncheck.json"
          cosign sign-blob --yes --bundle "$report.sigstore.json" "$report"
          sbom="dist/agent-remote-node-${VERSION}.spdx.json"
          cosign sign-blob --yes --bundle "$sbom.sigstore.json" "$sbom"
      - name: Attest Node release archives
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz
      - name: Verify Node release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          jq -e '.spdxVersion | startswith("SPDX-")' \
            "dist/agent-remote-node-${{ steps.version.outputs.value }}.spdx.json" >/dev/null
          sbom="dist/agent-remote-node-${VERSION}.spdx.json"
          cosign verify-blob \
            --bundle "$sbom.sigstore.json" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$sbom"
          for archive in dist/*.tar.gz; do
            sha256sum --check "$archive.sha256"
            cosign verify-blob \
              --bundle "$archive.sigstore.json" \
              --certificate-identity \
                "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$archive"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done
          report="agent-remote-node-${VERSION}.govulncheck.json"
          sha256sum --check "$report.sha256"
          cosign verify-blob \
            --bundle "$report.sigstore.json" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$report"
      - uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sigstore.json
            dist/*.spdx.json
            dist/*.spdx.json.sigstore.json
            agent-remote-node-${{ steps.version.outputs.value }}.govulncheck.json
            agent-remote-node-${{ steps.version.outputs.value }}.govulncheck.json.sha256
            agent-remote-node-${{ steps.version.outputs.value }}.govulncheck.json.sigstore.json
