name: skill-runtime-acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-runtime-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - name: Prove independent writable skill copies and protected permission baselines
        run: tests/linux_skill_copy_test.sh
      - name: Prove Helper configuration imports, fences and full-quota socket transfer
        run: bash tests/linux_config_import_test.sh
      - name: Prove skill aliases, readonly system mounts and safe unmounting
        run: tests/linux_skill_mount_test.sh
      - name: Prove Native skill finalization through real systemd lifecycle
        run: tests/linux_skill_systemd_test.sh
